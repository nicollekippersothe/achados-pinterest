name: Shopee Vídeos - worker

on:
  schedule:
    - cron: '0 */2 * * *'   # a cada 2 horas; o intervalo real entre posts é MIN_INTERVAL_MIN
  workflow_dispatch:

concurrency:
  group: shopee-video-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: shopee-video
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SHOPEE_UPLOAD_URL: ${{ secrets.SHOPEE_UPLOAD_URL }}
      PUBLISHER: playwright
      HEADLESS: 'true'
      MIN_INTERVAL_MIN: '90'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: shopee-video/package-lock.json
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
        working-directory: .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Restaurar sessão da Shopee
        env:
          STORAGE_STATE_B64: ${{ secrets.STORAGE_STATE_B64 }}
        run: echo "$STORAGE_STATE_B64" | base64 -d > storageState.json
      - run: npx tsx src/worker.ts --once
